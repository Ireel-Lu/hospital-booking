spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hospital_appointment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: dg_admin
    password: 123456

  #redis配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0

mybatis-plus:
  #mapper.xml文件地址
  mapper-locations: classpath*:mapper/**/*.xml
  #别名扫描包
  type-aliases-package: com.hospital.booking.entity

  configuration:
    map-underscore-to-camel-case: true
    #是否开启二级缓存
    cache-enabled: false

  global-config:
    db-config:
      logic-delete-field:
      logic-delete-value:
      logic-not-delete-value:


#对于swagger 关联的 knife4j ，springboot3只需要这个属性即可
knife4j:
  enable: true #开启knife4j增强，比如接口调试、导出文档，不写默认true


logging:
  level:
    org: warn
    org.example.mp_demo: debug


#jwt配置
jwt:
  secret: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz
  expiration: 86400000
